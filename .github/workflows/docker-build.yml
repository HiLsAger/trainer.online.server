name: Build & Push Backend Image

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/trainer-backend:${{ github.ref_name }} .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/trainer-backend:${{ github.ref_name }}