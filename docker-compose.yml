services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-hils}
      DB_PASSWORD: ${DB_PASSWORD:-0497}
      DB_NAME: ${DB_NAME:-trainer_online}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-super_secret_root}
      MYSQL_DATABASE: ${DB_NAME:-trainer_online}
      MYSQL_USER: ${DB_USER:-hils}
      MYSQL_PASSWORD: ${DB_PASSWORD:-0497}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network: